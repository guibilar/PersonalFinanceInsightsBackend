# Copy .env.example to .env and set the passwords before `docker compose up --build`.

# Docker keeps container logs forever by default; cap each service at 3 files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      # Hestia.Contracts comes from GitHub Packages: the restore needs a token (see .env.example and the README).
      secrets:
        - hestia_packages_user
        - hestia_packages_token
    container_name: personal-finance-api
    # Browsers reach the API only through the frontend (nginx behind Tailscale HTTPS), over the
    # "finance" network. The port stays open on this machine alone, for curl and debugging.
    ports:
      - "127.0.0.1:5096:8080"
    networks:
      - default
      - finance
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-FinanceDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Database__MigrateOnStartup: "true"
      # The account to sign in with, created on first start (there is no public sign-up).
      Auth__InitialUser__Username: "${FINANCE_USERNAME:?Set FINANCE_USERNAME in .env}"
      Auth__InitialUser__Password: "${FINANCE_PASSWORD:?Set FINANCE_PASSWORD in .env}"
      Auth__InitialUser__ResetPassword: "${FINANCE_RESET_PASSWORD:-false}"
      # Optional: a bearer token that reads but changes nothing (scripts, an assistant). Empty turns it off.
      Auth__ReadOnlyToken: "${FINANCE_READONLY_TOKEN:-}"
      # Hestia T03. Cookie (default): this API signs users in. Gateway: Hestia.Api signs users in, and this API accepts
      # only its gateway tokens, checked with the public key (see "Signing in" in the README).
      Auth__Mode: "${FINANCE_AUTH_MODE:-Cookie}"
      Auth__Gateway__PublicKey: "${GATEWAY_PUBLIC_KEY:-}"
      # The finance events (T04): the broker of the "events" profile. Empty: no events, finance works as before.
      Events__RabbitMq: "${EVENTS_RABBITMQ_URL:-}"
    depends_on:
      db:
        condition: service_healthy
      # Only with the "events" profile.
      rabbitmq:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *logging
    # The image has no curl: bash asks /health/live itself (the process answers; no database needed).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-FinanceDb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Loopback only: local tools (psql, `dotnet run`) can connect, other machines on the network can't.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *logging

  # Dumps the database when it starts and every night (docker/backup.sh), into ./backups on this machine.
  # Copy that folder somewhere else too (another disk, cloud storage): a backup on the same disk doesn't
  # survive the disk. Restore with docker/restore.sh.
  backup:
    # Same image as the database, so pg_dump always matches the server version.
    image: postgres:15
    container_name: postgres-backup
    # As the host user who owns the backup folder, so the dumps (owner-only, see backup.sh) can be
    # copied and encrypted without sudo. pg_dump needs nothing else from the user: no home directory
    # (the password comes from PGPASSWORD, not ~/.pgpass). The folder must exist and belong to that user.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-FinanceDb}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    # Unhealthy when the newest dump is more than 26 hours old (a nightly run failed).
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'finance-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      start_period: 2m
      start_interval: 5s

  # The broker for the finance events (T04, D7): finance publishes, Hestia.Api consumes. Only with the "events"
  # profile (COMPOSE_PROFILES=events in .env). On "finance", so Hestia.Api reaches it as rabbitmq:5672.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    profiles: ["events"]
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hestia}
      # Set RABBITMQ_PASSWORD in .env for the events profile (no default: an empty password lets nobody in).
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    networks:
      - default
      - finance
    # The management page, on this machine only: http://localhost:15672
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

networks:
  # Shared with the frontend's docker compose project, which joins it as an external network:
  # start this project first. The database stays on this project's default network only.
  finance:
    name: finance

secrets:
  hestia_packages_user:
    environment: HESTIA_PACKAGES_USER
  hestia_packages_token:
    environment: HESTIA_PACKAGES_TOKEN

volumes:
  postgres_data:
  rabbitmq_data:
