# Copy .env.example to .env and set the passwords before `docker compose up --build`.
services:
  app:
    build: .
    container_name: personal-finance-api
    ports:
      - "5096:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-FinanceDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Database__MigrateOnStartup: "true"
      # The account to sign in with, created on first start (there is no public sign-up).
      Auth__InitialUser__Username: "${FINANCE_USERNAME:?Set FINANCE_USERNAME in .env}"
      Auth__InitialUser__Password: "${FINANCE_PASSWORD:?Set FINANCE_PASSWORD in .env}"
      Auth__InitialUser__ResetPassword: "${FINANCE_RESET_PASSWORD:-false}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-FinanceDb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Loopback only: local tools (psql, `dotnet run`) can connect, other machines on the network can't.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
