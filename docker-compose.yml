services:
  app:
    build: .
    container_name: personal-finance-api
    ports:
      - "5096:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=FinanceDb;Username=postgres;Password=postgres
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      - db
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: FinanceDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

