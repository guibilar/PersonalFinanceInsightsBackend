name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so advisories published after the last commit still fail the vulnerability check.
  schedule:
    - cron: '17 6 * * 1'

# Bash with pipefail: a failed command in a pipe fails its step.
defaults:
  run:
    shell: bash

# Hestia.Contracts comes from GitHub Packages (NuGet.Config), which needs a token also for a public package.
permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HESTIA_PACKAGES_USER: ${{ github.actor }}
      HESTIA_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      # Packages the API and CLI ship with; test-only packages and low-severity advisories don't block.
      - name: Known vulnerabilities
        run: scripts/check-vulnerable-packages.sh | sed "s/^/::error::/"
      - run: dotnet build --no-restore
      # The code-style rules the .editorconfig sets as warnings (file-scoped namespaces); whitespace is left alone.
      - name: Code style
        run: dotnet format style --verify-no-changes --no-restore --severity warn
      - run: dotnet tool restore

      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project Finance.Infrastructure --startup-project FinanceApi --no-build

      # --report-xunit-trx: xUnit v3 writes a TRX file per test project, for the annotations (Hestia T40).
      - name: Tests (in-memory database, events off)
        id: tests-in-memory
        run: dotnet test --no-build --results-directory TestResults/in-memory --report-xunit-trx
      # Totals and failed tests as annotations: task sessions cannot read the logs, only the annotations.
      - name: Test results (in-memory database)
        if: always() && steps.tests-in-memory.outcome != 'skipped'
        run: python3 scripts/test-annotations.py in-memory TestResults/in-memory

      # The tests start PostgreSQL and RabbitMQ themselves in Docker (Testcontainers) and remove them afterwards.
      # The event tests (EventTests) need both.
      - name: Tests (PostgreSQL migrated from scratch, RabbitMQ)
        id: tests-postgres
        run: dotnet test --no-build --results-directory TestResults/postgres --report-xunit-trx
        env:
          FINANCE_TEST_POSTGRES: container
          FINANCE_TEST_RABBITMQ: container
      - name: Test results (PostgreSQL, RabbitMQ)
        if: always() && steps.tests-postgres.outcome != 'skipped'
        run: python3 scripts/test-annotations.py postgres TestResults/postgres

      # Hestia T03: the signed-in tests again, with gateway tokens (auth mode Gateway) instead of the test sign-in.
      - name: Tests (auth mode Gateway, in-memory database)
        id: tests-gateway
        run: dotnet test --no-build --results-directory TestResults/gateway --report-xunit-trx
        env:
          FINANCE_TEST_AUTH: gateway
      - name: Test results (auth mode Gateway)
        if: always() && steps.tests-gateway.outcome != 'skipped'
        run: python3 scripts/test-annotations.py gateway TestResults/gateway

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # What .env provides on the server.
    env:
      POSTGRES_PASSWORD: ci-database-password
      FINANCE_USERNAME: ci
      FINANCE_PASSWORD: ci-password-long-enough
      # The Docker build restores Hestia.Contracts from GitHub Packages with these (build secrets).
      HESTIA_PACKAGES_USER: ${{ github.actor }}
      HESTIA_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The finance events on, with the broker of the "events" profile: as on the server.
      COMPOSE_PROFILES: events
      RABBITMQ_USER: hestia
      RABBITMQ_PASSWORD: ci-rabbitmq-password
      EVENTS_RABBITMQ_URL: amqp://hestia:ci-rabbitmq-password@rabbitmq:5672
    steps:
      - uses: actions/checkout@v7
      # As on the server: the backup container runs as the user who owns ./backups.
      - name: Backup folder owned by the runner's user
        run: |
          mkdir -p backups
          echo "BACKUP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "BACKUP_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build and start the stack (API, PostgreSQL, backup, and RabbitMQ, as deployed)
        run: |
          docker compose up -d --build --wait
          for i in $(seq 1 60); do curl -sf http://localhost:5096/health/ready > /dev/null && break; sleep 1; done
      - name: The finance events are on (outbox tables and the exchange exist)
        run: |
          docker compose logs app > app.log 2>&1
          docker compose ps -a > ps.log 2>&1
          ok=true
          grep -q "Finance events are on" app.log || ok=false
          exchange=no
          for i in $(seq 1 30); do
            if docker exec rabbitmq rabbitmqctl -q list_exchanges name > exchanges.log 2>&1 && grep -qx 'hestia.finance-events' exchanges.log; then
              exchange=yes
              break
            fi
            sleep 1
          done
          [ "$exchange" = yes ] || ok=false
          docker compose exec -T db psql -U postgres -d FinanceDb -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'wolverine' AND table_name = 'wolverine_outgoing_envelopes'" > tables.log 2>&1 || true
          grep -qx 1 tables.log || ok=false
          if [ "$ok" != true ]; then
            echo "== containers"; cat ps.log
            echo "== exchanges"; cat exchanges.log
            echo "== outbox table"; cat tables.log
            echo "== API log"; grep -iE "event|wolverine|rabbit|fail|error" app.log | tail -40
            exit 1
          fi
      - name: The API runs as a non-root user
        run: test "$(docker exec personal-finance-api id -u)" != 0
      - name: Smoke test (health, sign-in, session cookie, protected calls)
        run: docker/smoke-test.sh http://localhost:5096
      - name: Backup written at start (owner-only, the runner's), and restore.sh restores it and drops an extra schema
        run: |
          dump=$(ls backups/finance-*.dump | head -n 1)
          test "$(stat -c %a "$dump")" = 600
          test "$(stat -c %u "$dump")" = "$(id -u)"
          # A schema that the dump does not have (as a later migration or module adds one): the restore must drop it.
          docker compose exec -T db psql -U postgres -d FinanceDb -v ON_ERROR_STOP=1 -qc \
            "CREATE SCHEMA ci_extra; CREATE TABLE ci_extra.leftover (id int PRIMARY KEY); INSERT INTO ci_extra.leftover VALUES (1);"
          echo "Restoring $dump"
          docker/restore.sh "$dump"
          test "$(stat -c %a backups/before-restore-*.dump)" = 600
          docker compose up -d --wait
          docker/smoke-test.sh http://localhost:5096
          extra=$(docker compose exec -T db psql -U postgres -d FinanceDb -tAc \
            "SELECT count(*) FROM pg_namespace WHERE nspname = 'ci_extra'")
          if [ "$extra" != 0 ]; then
            echo "::error title=Restore::The schema ci_extra is still there after restore.sh"
            exit 1
          fi
          # The API makes the Wolverine outbox tables again at start, if the dump had none.
          outbox=0
          for i in $(seq 1 30); do
            outbox=$(docker compose exec -T db psql -U postgres -d FinanceDb -tAc \
              "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'wolverine' AND table_name = 'wolverine_outgoing_envelopes'")
            [ "$outbox" = 1 ] && break
            sleep 1
          done
          if [ "$outbox" != 1 ]; then
            echo "::error title=Restore::The Wolverine outbox table is missing after restore.sh"
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
