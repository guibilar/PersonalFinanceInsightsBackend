name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so advisories published after the last commit still fail the vulnerability check.
  schedule:
    - cron: '17 6 * * 1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      # Packages the API and CLI ship with; test-only packages and low-severity advisories don't block.
      - name: Known vulnerabilities
        run: scripts/check-vulnerable-packages.sh
      - run: dotnet build --no-restore
      - run: dotnet tool restore

      - name: Migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project Finance.Infrastructure --startup-project FinanceApi --no-build

      - name: Tests (in-memory database)
        run: dotnet test --no-build

      # The tests start PostgreSQL themselves in Docker (Testcontainers) and remove it afterwards.
      - name: Tests (PostgreSQL, migrated from scratch)
        run: dotnet test --no-build
        env:
          FINANCE_TEST_POSTGRES: container

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # What .env provides on the server.
    env:
      POSTGRES_PASSWORD: ci-database-password
      FINANCE_USERNAME: ci
      FINANCE_PASSWORD: ci-password-long-enough
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack (API + PostgreSQL, as deployed)
        run: |
          docker compose up -d --build --wait
          for i in $(seq 1 60); do curl -sf http://localhost:5096/health/ready > /dev/null && break; sleep 1; done
      - name: The API runs as a non-root user
        run: test "$(docker exec personal-finance-api id -u)" != 0
      - name: Smoke test (health, sign-in, session cookie, protected calls)
        run: docker/smoke-test.sh http://localhost:5096
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
