# TEMPORARY (T03): the task session cannot build locally or read CI logs. This job fixes the code style, commits the
# result to the branch, and writes failed tests as annotations. Removed before the review.
name: T03 probe

on:
  push:
    branches: [hestia/T03-gateway-auth]

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      - name: Code style (fix)
        run: dotnet format style --severity warn --no-restore || true
      - name: Commit the fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "T03 probe: code style fixes"
            git push
            echo "::notice title=Probe::Pushed code style fixes. Pull them."
          fi
      - name: Tests (in-memory, cookie mode)
        run: dotnet test --no-build 2>&1 | tee "$RUNNER_TEMP/test.log" || true
      - name: Test annotations (cookie mode)
        run: python3 .github/probe/annotate.py "$RUNNER_TEMP/test.log"
      - name: Tests (in-memory, gateway mode)
        env:
          FINANCE_TEST_AUTH: gateway
        run: dotnet test --no-build 2>&1 | tee "$RUNNER_TEMP/test-gw.log" || true
      - name: Test annotations (gateway mode)
        run: python3 .github/probe/annotate.py "$RUNNER_TEMP/test-gw.log"
